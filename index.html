<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aysu Doğan Gök | Dashboard</title>

  <style>
    :root{
      --bg: #fbfbfd;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --border: rgba(17,24,39,.10);

      --p1: #dbeafe;
      --p2: #fce7f3;
      --p3: #dcfce7;

      --accent: #4f46e5;
      --accent2: #7c3aed;

      --shadow: 0 12px 35px rgba(17,24,39,.08);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif;
    }
    a{ color:inherit; text-decoration:none; }
    .container{ width:min(1120px, 92vw); margin:0 auto; }

    .bg-wash{
      background:
        radial-gradient(900px 350px at 20% 0%, var(--p1), transparent 60%),
        radial-gradient(900px 350px at 80% 0%, var(--p2), transparent 60%),
        radial-gradient(900px 350px at 50% 40%, var(--p3), transparent 60%);
      padding-bottom: 18px;
    }

    /* Navbar */
    .nav{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(251,251,253,.75);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 0;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight: 800;
      letter-spacing: .2px;
      white-space: nowrap;
    }
    .dot{
      width: 12px; height:12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 14px rgba(79,70,229,.25);
    }
    .nav-links{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .nav-links a{
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      border: 1px solid transparent;
      transition: all .15s ease;
    }
    .nav-links a:hover{
      color: var(--ink);
      border-color: var(--border);
      background: rgba(255,255,255,.7);
    }

    /* Sections */
    main{ padding: 18px 0 38px; }
    section{ margin: 14px 0; }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .section-head{
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .section-body{
      padding: 16px 18px;
      min-height: 120px;
    }

    /* Dashboard embed */
    .embed-wrap{
      overflow:hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: white;
    }
    iframe{ width:100%; height: 72vh; min-height: 560px; border:0; display:block; }

    /* Footer */
    footer{
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    @media (max-width: 720px){
      .nav-inner{ align-items:flex-start; }
      .nav-links{ justify-content:flex-start; }
    }
  </style>
</head>

<body>
  <div class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#top"><span class="dot"></span><span>Aysu Doğan Gök</span></a>
      <nav class="nav-links">
        <a href="#dashboard">Dashboard</a>
        
        <a href="#projeler">Projeler</a>
        <a href="#hakkimda">Hakkımda</a>
        <a href="#iletisim">İletişim</a>
      </nav>
    </div>
  </div>

  <div class="bg-wash" id="top">
    <div class="container" style="padding:18px 0 6px;"></div>
  </div>

  <main class="container">
    <section id="dashboard">
      <div class="section-head card">Dashboard</div>
      <div class="embed-wrap">
        <iframe src="https://aysudogangok.shinyapps.io/kamu_demo_app_fixed/"></iframe>
      </div>
    </section>

    <section id="haritalar" class="card">
      <div class="section-head">Haritalar</div>
      <div class="section-body"></div>
    </section>

    <section id="projeler" class="card">
      <div class="section-head">Projeler</div>
      <div class="section-body"></div>
    </section>

    <section id="hakkimda" class="card">
      <div class="section-head">Hakkımda</div>
      <div class="section-body"></div>
    </section>

    <section id="iletisim" class="card">
      <div class="section-head">İletişim</div>
      <div class="section-body"></div>
    </section>

    <footer class="container">
      <div>© <span id="year"></span></div>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
